<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Larry's iPad Guide</title><style>body{font-family:-apple-system,sans-serif;margin:20px;background:#f5f5f5}input{width:100%;padding:12px;font-size:18px}button{display:block;width:100%;margin:8px 0;padding:14px;font-size:20px;background:#0b5ed7;color:#fff;border:none;border-radius:8px}</style><script>function f(){let q=document.getElementById('s').value.toLowerCase();document.querySelectorAll('.t').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(q)?'block':'none');}</script></head><body><h1>Larry's iPad Guide</h1><input id='s' onkeyup='f()' placeholder='Search'><div class='t'><button>Home Screen</button></div><div class='t'><button>Files App</button></div><div class='t'><button>Safari</button></div><div class='t'><button>Settings</button></div><div class='t'><button>Photos</button></div><div class='t'><button>Wi‑Fi</button></div><div class='t'><button>Bluetooth</button></div><div class='t'><button>iCloud</button></div><div class='t'><button>Messages</button></div><div class='t'><button>Mail</button></div><div class='t'><button>Passwords</button></div><div class='t'><button>Accessibility</button></div><div class='t'><button>Storage</button></div><div class='t'><button>Troubleshooting</button></div></body></html>
